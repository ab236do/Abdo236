<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات الزعيم كافية</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حسابات الزعيم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1621">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0e1621;--card:#17212e;--line:#26354a;--ink:#e8edf4;--mut:#8a97aa;--teal:#67c1b9;--gold:#d9a957;--red:#e0806f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Geeza Pro","Segoe UI",Tahoma,sans-serif;padding:14px 14px 40px}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:19px;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{border:2px solid var(--teal)}
.lbl{color:var(--mut);font-size:15px}
.val{font-size:34px;font-weight:700;margin-top:6px}
.val.sm{font-size:26px}
.gold{color:var(--gold)}.tl{color:var(--teal)}.neg{color:var(--red)}.pos{color:#5fd38d}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 10px;font:inherit;font-size:18px;font-weight:700;margin-bottom:12px;color:#0b1620;cursor:pointer}
.b-teal{background:var(--teal)}.b-gold{background:var(--gold)}.b-red{background:var(--red)}
.out{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g2 .box,.g2 .btn{margin:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mini{width:auto;margin:0;padding:10px 14px;font-size:16px;border-radius:14px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{padding:11px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:400;font-size:15px}
td.n{font-weight:700}
.empty{color:var(--mut);text-align:center;padding:16px 0}
.x{background:none;border:0;color:var(--red);font-size:20px;padding:4px 8px}
.mrow{display:flex;justify-content:space-between;padding:6px 0}
label{display:block;margin:12px 0 6px;color:var(--mut);font-size:15px}
input{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0b121b;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.err{color:var(--red);min-height:22px;margin-top:8px;font-size:15px}
.foot{display:flex;gap:10px;margin-top:14px}.foot .btn{margin:0;font-size:16px;padding:13px 8px}
.sm2{display:flex;gap:10px;margin-top:20px}.sm2 .btn{margin:0;font-size:15px;padding:12px 6px}
</style></head><body>
<h1>حسابات الزعيم كافية</h1>

<div class="box hero"><div class="lbl">رصيد الخزنة النقدي الشامل</div><div class="val tl" id="all"></div></div>
<button class="btn b-teal" data-a="cash">+ إضافة نقود للخزنة</button>

<div class="box"><div class="lbl">رصيد الآجل (يُضاف للرصيد الشامل)</div><div class="val" id="def"></div></div>
<button class="btn out" data-a="def">+ إضافة لرصيد الآجل</button>

<div class="g2">
 <div class="box"><div class="lbl">المتاح في الخزنة</div><div class="val sm" id="av"></div></div>
 <div class="box"><div class="lbl">إجمالي حسابات التجار (الدين)</div><div class="val sm gold" id="debt"></div></div>
</div>

<div class="box"><div class="lbl">صافي الخزنة بعد الدين (المتاح − الدين)</div><div class="val" id="net"></div></div>

<div class="box">
 <div class="head"><h2>جدول حسابات التجار</h2><button class="btn out mini" data-a="newm">+ تاجر</button></div>
 <div class="g2" style="margin-bottom:6px"><button class="btn b-gold" data-a="add">+ إضافة للتاجر</button><button class="btn b-red" data-a="pay">– خصم من التاجر</button></div>
 <table><thead><tr><th>الكود</th><th>اسم التاجر</th><th>الرصيد</th><th></th></tr></thead><tbody id="mt"></tbody></table>
</div>

<div class="box">
 <div class="head"><h2>المصروفات (تُخصم من الخزنة مباشرة)</h2></div>
 <button class="btn b-teal" data-a="exp">– تسجيل مصروف</button>
 <table><thead><tr><th>البند</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody id="el"></tbody></table>
 <label for="q">إجمالي ما سُحب باسم معيّن</label>
 <input id="q" type="search" placeholder="اكتب الاسم، مثال: عبدالرحمن" autocomplete="off" oninput="draw()">
 <div id="et"></div>
</div>

<div class="box"><div class="head" style="margin-bottom:8px"><h2>إجمالي عمليات الشهر</h2><span class="lbl" id="mname"></span></div><div id="mon"></div></div>

<div class="sm2"><button class="btn out" id="exp">نسخة احتياطية</button><button class="btn out" id="imp">استرجاع</button></div>
<input type="file" id="file" accept=".json" hidden>

<dialog id="dlg"><form method="dialog" onsubmit="return false"><h2 id="dt"></h2><div id="flds"></div><div class="err" id="err"></div>
<div class="foot"><button class="btn b-teal" id="ok">حفظ</button><button type="button" class="btn out" id="cx">إلغاء</button></div></form></dialog>
<datalist id="names"></datalist>

<script>
const K='kafia-ledger-v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{t:0,m:[],l:[],n:1};S.d=S.d||0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('تعذر الحفظ على الموبايل')}};
const $=id=>document.getElementById(id);
const f=n=>Number(n).toLocaleString('ar-EG',{maximumFractionDigits:2});
const cur=n=>f(n)+' ج.م';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const num=v=>{v=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,\s]/g,'').replace('٫','.'));return isNaN(v)?0:v};
const find=q=>{q=norm(q.trim());return S.m.find(x=>String(x.c)===q)||S.m.find(x=>norm(x.n)===q)||S.m.find(x=>norm(x.n).includes(q))};
const log=(k,a,w)=>S.l.push({d:Date.now(),k,a,w});

const A={
 cash:{t:'إضافة نقود للخزنة',f:[['amt','المبلغ (ج.م)','n'],['note','ملاحظة (اختياري)','t']],go(v){S.t+=v.amt;log('cash',v.amt,v.note)}},
 def:{t:'إضافة لرصيد الآجل',f:[['amt','المبلغ (ج.م)','n'],['note','ملاحظة (اختياري)','t']],go(v){S.d+=v.amt;log('def',v.amt,v.note)}},
 exp:{t:'تسجيل مصروف',f:[['item','البند','t'],['amt','المبلغ (ج.م)','n']],go(v){if(!v.item.trim())throw'اكتب البند';S.t-=v.amt;log('exp',v.amt,v.item.trim())}},
 add:{t:'إضافة للتاجر',f:[['who','اسم التاجر أو كوده','t','l'],['amt','المبلغ (ج.م)','n']],go(v){const m=find(v.who);if(!m)throw'التاجر مش موجود';m.b+=v.amt;log('add',v.amt,m.n)}},
 pay:{t:'خصم من التاجر (يُخصم من الخزنة)',f:[['who','اسم التاجر أو كوده','t','l'],['amt','المبلغ (ج.م)','n']],go(v){const m=find(v.who);if(!m)throw'التاجر مش موجود';m.b-=v.amt;S.t-=v.amt;log('pay',v.amt,m.n)}},
 newm:{t:'تاجر جديد',noamt:1,f:[['name','اسم التاجر','t'],['amt','رصيد افتتاحي (اختياري)','n']],go(v){const n=v.name.trim();if(!n)throw'اكتب الاسم';if(S.m.some(x=>x.n===n))throw'الاسم موجود قبل كده';S.m.push({c:S.n++,n,b:v.amt||0})}}
};
let act=null;
function open(a){act=a;$('dt').textContent=A[a].t;$('err').textContent='';
 $('flds').innerHTML=A[a].f.map(([id,l,t,dl])=>`<label for="f_${id}">${l}</label><input id="f_${id}" type="text" ${t==='n'?'inputmode="decimal"':''} ${dl?'list="names"':''} autocomplete="off">`).join('');
 $('dlg').showModal();$('flds').querySelector('input').focus()}
$('ok').onclick=()=>{const d=A[act],v={};d.f.forEach(([id,,t])=>{const x=$('f_'+id).value;v[id]=t==='n'?num(x):x});
 try{if(!d.noamt&&!(v.amt>0))throw'اكتب مبلغ أكبر من صفر';d.go(v);save();$('dlg').close();draw()}catch(e){$('err').textContent=typeof e==='string'?e:'حصل خطأ'}};
$('cx').onclick=()=>$('dlg').close();
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>open(b.dataset.a));
function del(c){const m=S.m.find(x=>x.c===c);if(m&&confirm('حذف التاجر "'+m.n+'"'+(m.b?' (رصيده '+f(m.b)+')':'')+'؟')){S.m=S.m.filter(x=>x.c!==c);save();draw()}}
const sgn=(el,v)=>el.classList.toggle('neg',v<0);

function draw(){
 const debt=S.m.reduce((s,m)=>s+m.b,0),all=S.t+S.d;
 $('all').textContent=cur(all);sgn($('all'),all);
 $('def').textContent=cur(S.d);
 $('av').textContent=cur(S.t);sgn($('av'),S.t);
 $('debt').textContent=cur(debt);
 const net=S.t-debt;$('net').textContent=cur(net);$('net').classList.toggle('neg',net<0);$('net').classList.toggle('pos',net>=0);
 $('mt').innerHTML=S.m.length?S.m.map(m=>`<tr><td>${f(m.c)}</td><td>${esc(m.n)}</td><td class="n">${f(m.b)}</td><td><button class="x" aria-label="حذف" onclick="del(${m.c})">×</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">لا يوجد تجار بعد. اضغط «+ تاجر» لإضافة أول تاجر.</td></tr>';
 $('names').innerHTML=S.m.map(m=>`<option value="${esc(m.n)}">`).join('');
 const q=norm($('q').value.trim()),ex=S.l.filter(x=>x.k==='exp'&&(!q||norm(x.w).includes(q))).reverse();
 $('el').innerHTML=ex.length?ex.map(x=>`<tr><td>${esc(x.w)}</td><td class="n">${f(x.a)}</td><td>${new Date(x.d).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</td></tr>`).join(''):`<tr><td colspan="3" class="empty">${q?'مفيش مصروف بالاسم ده':'لا توجد مصروفات مسجلة بعد.'}</td></tr>`;
 $('et').innerHTML=q&&ex.length?`<div class="mrow" style="margin-top:10px"><span>إجمالي ما سُحب (${f(ex.length)})</span><b class="gold">${cur(ex.reduce((t,x)=>t+x.a,0))}</b></div>`:'';
 const now=new Date(),mo=S.l.filter(x=>{const d=new Date(x.d);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
 const sum=k=>mo.filter(x=>x.k===k).reduce((s,x)=>s+x.a,0);
 $('mname').textContent=now.toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
 $('mon').innerHTML=mo.length?[['نقود مضافة للخزنة',sum('cash')],['مضاف للآجل',sum('def')],['مصروفات',sum('exp')],['مضاف للتجار',sum('add')],['مخصوم من التجار',sum('pay')]].map(([l,v])=>`<div class="mrow"><span>${l}</span><b>${cur(v)}</b></div>`).join('')+`<div class="mrow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span>عدد العمليات</span><b>${f(mo.length)}</b></div>`:'<div class="empty">لا توجد عمليات هذا الشهر.</div>';
}

$('exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kafia-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.m)||!Array.isArray(o.l))throw 0;if(confirm('هيستبدل البيانات الحالية بالنسخة دي. متأكد؟')){S=o;S.d=S.d||0;save();draw()}}catch(x){alert('الملف مش نسخة احتياطية صحيحة')}};if(e.target.files[0])r.readAsText(e.target.files[0]);e.target.value=''};

draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
