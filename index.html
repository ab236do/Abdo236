<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات الزعيم كافية</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حسابات الزعيم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b3b36">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#eceff0;--card:#fff;--ink:#0b3b36;--mut:#5d6f6c;--line:#d5dcdb;--brass:#a8741a;--red:#b3261e;--grn:#1b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#16201f;--ink:#e4efed;--mut:#8fa5a1;--line:#2a3a38;--brass:#e0b052;--red:#ff8a80;--grn:#6fd6a0}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Geeza Pro","Segoe UI",Tahoma,sans-serif;padding:14px 14px 40px;max-width:560px;margin:auto}
h1{font-size:22px;margin:6px 0 14px;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.big{font-size:30px;font-weight:700;letter-spacing:.3px}
.lbl{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.neg{color:var(--red)}.treas .big{color:var(--brass)}
button{font:inherit;border:0;border-radius:9px;padding:12px 8px;font-weight:600;background:var(--ink);color:var(--bg);width:100%}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
button.sm{width:auto;padding:4px 10px;font-size:13px;background:transparent;color:var(--red);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:13px}
td.n{font-weight:700;font-variant-numeric:tabular-nums}
.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px}
.sec h2{font-size:17px;margin:0}
.mrow{display:flex;justify-content:space-between;padding:4px 0}
.empty{color:var(--mut);padding:10px 0;text-align:center}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.foot{display:flex;gap:10px;margin-top:18px}
.err{color:var(--red);min-height:20px;font-size:14px;margin-top:8px}
</style></head><body>
<h1>حسابات الزعيم كافية</h1>

<div class="box"><div class="lbl">الرصيد النقدي الشامل (الخزنة − مديونية التجار)</div><div class="big" id="net"></div></div>
<div class="box treas"><div class="lbl">رصيد الخزنة المتاح</div><div class="big" id="tre"></div></div>
<div class="box"><div class="lbl">إجمالي مديونية التجار</div><div class="big" id="debt"></div></div>

<div class="btns">
<button data-a="cash">+ إضافة نقدية</button>
<button data-a="exp" class="alt">مصروفات</button>
<button data-a="add">+ إضافة مبلغ لتاجر</button>
<button data-a="pay" class="alt">خصم من تاجر</button>
</div>

<div class="sec"><h2>التجار</h2><button class="sm" style="color:var(--ink)" data-a="newm">+ تاجر جديد</button></div>
<div class="box" style="padding:4px 12px"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الرصيد</th><th></th></tr></thead><tbody id="mt"></tbody></table></div>

<div class="sec"><h2>عمليات الشهر</h2><span class="lbl" id="mname"></span></div>
<div class="box" id="mon"></div>

<div class="foot"><button class="alt" id="exp">نسخة احتياطية</button><button class="alt" id="imp">استرجاع</button></div>
<input type="file" id="file" accept=".json" hidden>

<dialog id="dlg"><form method="dialog" id="frm" onsubmit="return false"><h2 id="dt" style="margin:0 0 4px;font-size:18px"></h2><div id="flds"></div><div class="err" id="err"></div>
<div class="foot"><button id="ok">حفظ</button><button type="button" class="alt" id="cx">إلغاء</button></div></form></dialog>
<datalist id="names"></datalist>

<script>
const K='kafia-ledger-v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{t:0,m:[],l:[],n:1};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('تعذر الحفظ على الموبايل')}};
const f=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const $=id=>document.getElementById(id);
const cls=(el,v)=>el.classList.toggle('neg',v<0);
const find=q=>{q=q.trim();return S.m.find(x=>String(x.c)===q)||S.m.find(x=>x.n===q)||S.m.find(x=>x.n.includes(q))};
const num=v=>{v=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.'));return isNaN(v)?0:v};
const log=(k,a,w)=>S.l.push({d:Date.now(),k,a,w});

const A={
 cash:{t:'إضافة نقدية للخزنة',f:[['amt','المبلغ (ج.م)','number'],['note','ملاحظة (اختياري)','text']],
  go(v){S.t+=v.amt;log('cash',v.amt,v.note)}},
 exp:{t:'مصروفات (تُخصم من الخزنة)',f:[['item','البند','text'],['amt','المبلغ (ج.م)','number']],
  go(v){if(!v.item.trim())throw'اكتب البند';S.t-=v.amt;log('exp',v.amt,v.item.trim())}},
 add:{t:'إضافة مبلغ لتاجر (يزيد المديونية)',f:[['who','اسم التاجر أو كوده','text','names'],['amt','المبلغ (ج.م)','number']],
  go(v){const m=find(v.who);if(!m)throw'التاجر مش موجود';m.b+=v.amt;log('add',v.amt,m.n)}},
 pay:{t:'خصم من تاجر (يُخصم من الخزنة)',f:[['who','اسم التاجر أو كوده','text','names'],['amt','المبلغ (ج.م)','number']],
  go(v){const m=find(v.who);if(!m)throw'التاجر مش موجود';m.b-=v.amt;S.t-=v.amt;log('pay',v.amt,m.n)}},
 newm:{t:'تاجر جديد',f:[['name','اسم التاجر','text'],['amt','رصيد افتتاحي (اختياري)','number']],noamt:1,
  go(v){const n=v.name.trim();if(!n)throw'اكتب الاسم';if(S.m.some(x=>x.n===n))throw'الاسم موجود قبل كده';S.m.push({c:S.n++,n,b:v.amt||0})}}
};
let cur=null;
function open(a){cur=a;const d=A[a];$('dt').textContent=d.t;$('err').textContent='';
 $('flds').innerHTML=d.f.map(([id,l,t,dl])=>`<label for="f_${id}">${l}</label><input id="f_${id}" type="${t==='number'?'text':t}" ${t==='number'?'inputmode="decimal"':''} ${dl?'list="names"':''} autocomplete="off">`).join('');
 $('dlg').showModal();$('flds').querySelector('input').focus()}
$('ok').onclick=()=>{const d=A[cur],v={};d.f.forEach(([id,,t])=>{const x=$('f_'+id).value;v[id]=t==='number'?num(x):x});
 try{if(!d.noamt&&!(v.amt>0))throw'اكتب مبلغ أكبر من صفر';d.go(v);save();$('dlg').close();draw()}catch(e){$('err').textContent=typeof e==='string'?e:'حصل خطأ'}};
$('cx').onclick=()=>$('dlg').close();
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>open(b.dataset.a));

function del(c){const m=S.m.find(x=>x.c===c);if(!m)return;
 if(confirm('حذف التاجر "'+m.n+'"'+(m.b?' (رصيده '+f(m.b)+')':'')+'؟')){S.m=S.m.filter(x=>x.c!==c);save();draw()}}

function draw(){
 const debt=S.m.reduce((s,m)=>s+m.b,0),net=S.t-debt;
 $('tre').textContent=f(S.t)+' ج.م';cls($('tre'),S.t);
 $('debt').textContent=f(debt)+' ج.م';
 $('net').textContent=f(net)+' ج.م';cls($('net'),net);
 $('mt').innerHTML=S.m.length?S.m.map(m=>`<tr><td>${m.c}</td><td>${m.n.replace(/</g,'&lt;')}</td><td class="n">${f(m.b)}</td><td><button class="sm" onclick="del(${m.c})">حذف</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">لسه مفيش تجار. دوس "تاجر جديد".</td></tr>';
 $('names').innerHTML=S.m.map(m=>`<option value="${m.n.replace(/"/g,'&quot;')}">`).join('');
 const now=new Date(),mo=S.l.filter(x=>{const d=new Date(x.d);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
 const sum=k=>mo.filter(x=>x.k===k).reduce((s,x)=>s+x.a,0);
 $('mname').textContent=now.toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
 $('mon').innerHTML=mo.length?[['نقدية مضافة',sum('cash')],['مصروفات',sum('exp')],['مبالغ أُضيفت للتجار',sum('add')],['مدفوع للتجار',sum('pay')]].map(([l,v])=>`<div class="mrow"><span>${l}</span><b>${f(v)}</b></div>`).join('')+`<div class="mrow" style="border-top:1px solid var(--line);margin-top:4px;padding-top:8px"><span>عدد العمليات</span><b>${mo.length}</b></div>`:'<div class="empty">مفيش عمليات الشهر ده لسه</div>';
}

$('exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kafia-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.m)||!Array.isArray(o.l))throw 0;if(confirm('هيستبدل البيانات الحالية بالنسخة دي. متأكد؟')){S=o;save();draw()}}catch(x){alert('الملف مش نسخة احتياطية صحيحة')}};if(e.target.files[0])r.readAsText(e.target.files[0]);e.target.value=''};

draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
